<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1118" />
    <title>Bomba Arena</title>
    <style>
      html,
      body {
        margin: 0;
        background: #0e1118;
        color: #f1f3f8;
      }

      .app {
        visibility: hidden;
      }
    </style>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💣</text></svg>" />
  </head>
  <body data-mode="local">
    <main class="app">
      <header class="top">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 24 24" width="34" height="34" aria-hidden="true">
            <path d="M17.5 14.5a7.5 7.5 0 1 1-15 0a7.5 7.5 0 1 1 15 0ZM13.4 8.2 15.4 6.2 17.8 8.6 15.8 10.6Z" />
            <path class="logo-spark" d="M19.6 0.6l1 2.4 2.4 1.2-2.4 1.2-1 2.4-1-2.4-2.4-1.2 2.4-1.2Z" />
          </svg>
          <h1>Bomba <span>Arena</span></h1>
        </div>
        <div class="top-actions">
          <span id="round" class="round-chip"></span>
          <button id="toggle-sound" class="icon-button" type="button" aria-label="Efeitos sonoros" title="Som (M)">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path class="fill" d="M4 9.5h3.4L12 5.6v12.8l-4.6-3.9H4z" />
              <path class="on" d="M15.6 9.2a4 4 0 0 1 0 5.6M18.2 6.6a7.6 7.6 0 0 1 0 10.8" />
              <path class="off" d="M16 9.6l4.8 4.8M20.8 9.6 16 14.4" />
            </svg>
          </button>
          <button id="toggle-fullscreen" class="icon-button fullscreen" type="button" aria-label="Tela cheia" aria-pressed="false" title="Tela cheia (F)">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path class="enter" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
              <path class="exit" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" />
            </svg>
          </button>
          <button id="toggle-music" class="icon-button" type="button" aria-label="Música" title="Música">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path d="M9 17V6.2l10-2.2v10.8" />
              <circle class="fill" cx="6.6" cy="17.2" r="2.6" />
              <circle class="fill" cx="16.6" cy="15" r="2.6" />
              <path class="off" d="M4 4.5 20.5 20" />
            </svg>
          </button>
        </div>
      </header>
      <section id="hud" class="hud" aria-label="Jogadores"></section>
      <div class="stage">
        <canvas id="board" aria-label="Arena do jogo"></canvas>
        <div id="overlay" class="overlay">
          <div class="panel">
            <div id="overlay-portraits" class="portraits"></div>
            <h2 id="overlay-title"></h2>
            <p id="overlay-text"></p>
            <div id="overlay-extra" class="extra"></div>
            <p id="overlay-countdown" class="countdown" aria-live="polite" hidden></p>
            <div id="overlay-actions" class="actions"></div>
            <p id="overlay-hint" class="hint"></p>
          </div>
        </div>
      </div>
      <footer class="controls" data-for="local">
        <div class="control p1">
          <span class="dot"></span>
          <strong>Jogador 1</strong>
          <span class="pair"><span class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span> mover</span>
          <span class="pair"><kbd>Espaço</kbd> bomba</span>
        </div>
        <div class="control p2">
          <span class="dot"></span>
          <strong>Jogador 2</strong>
          <span class="pair"><span class="keys"><kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd></span> mover</span>
          <span class="pair"><kbd>Enter</kbd> bomba</span>
        </div>
        <div class="control">
          <span class="pair"><kbd>Esc</kbd> pausa</span>
          <span class="pair"><kbd>M</kbd> som</span>
          <span class="pair"><kbd>F</kbd> tela cheia</span>
        </div>
      </footer>
      <footer class="controls" data-for="online">
        <div class="control">
          <strong>Controles</strong>
          <span class="pair"><span class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span> ou <span class="keys"><kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd></span> mover</span>
          <span class="pair"><kbd>Espaço</kbd> ou <kbd>Enter</kbd> bomba</span>
          <span class="pair" data-for="bot"><kbd>Esc</kbd> pausa</span>
          <span class="pair"><kbd>M</kbd> som</span>
          <span class="pair"><kbd>F</kbd> tela cheia</span>
        </div>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
